<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photocull</title>
<style>
  :root {
    --bg: #15171a; --panel: #1e2126; --line: #2e333a; --text: #e8eaed; --dim: #9aa3ad;
    --keep: #3ecf8e; --trash: #f0556a; --accent: #5aa9ff; --warn: #f5b84a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--trash); border-color: var(--trash); color: #fff; font-weight: 600; }
  button.primary:disabled { opacity: .35; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }

  header { position: sticky; top: 0; z-index: 5; background: rgba(21,23,26,.96);
           border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 6px 0 0; }
  #stats { color: var(--dim); flex: 1; min-width: 200px; }
  #stats b { color: var(--text); }
  .chips { display: flex; gap: 6px; }

  main { padding: 16px; max-width: 1500px; margin: 0 auto; }
  .hint { color: var(--dim); font-size: 12px; margin: 0 0 14px; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
        padding: 0 5px; font: 11px ui-monospace, Menlo, monospace; }

  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           margin-bottom: 14px; padding: 12px; }
  .group.focus { border-color: var(--accent); }
  .group.allgone { border-color: var(--warn); }
  .ghead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
           border-radius: 4px; padding: 2px 7px; }
  .badge.exact { background: #3b2630; color: #ff9aa8; }
  .badge.similar { background: #24324a; color: #9cc8ff; }
  .gmeta { color: var(--dim); flex: 1; }
  .gwarn { color: var(--warn); font-weight: 600; }

  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile { width: 220px; border: 2px solid var(--line); border-radius: 8px; overflow: hidden;
          background: #111316; cursor: pointer; position: relative; }
  .tile .pic { height: 160px; display: flex; align-items: center; justify-content: center; background: #0c0d0f; }
  .tile img { max-width: 100%; max-height: 160px; display: block; }
  .tile .nothumb { color: var(--dim); font-size: 12px; }
  .tile .cap { padding: 6px 8px; font-size: 12px; }
  .tile .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .state { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 700;
                 border-radius: 4px; padding: 2px 7px; background: var(--keep); color: #06281a; }
  .tile.marked { border-color: var(--trash); }
  .tile.marked .pic img { opacity: .35; }
  .tile.marked .state { background: var(--trash); color: #fff; }
  .tile .num { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.6);
               border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--dim); }
  .tile .zoom { position: absolute; top: 128px; right: 6px; padding: 2px 8px; font-size: 12px;
                background: rgba(0,0,0,.7); }
  .tags { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-weight: 700; border: 1px solid var(--line); border-radius: 3px;
         padding: 0 5px; color: var(--dim); }
  .tag.best { color: var(--keep); border-color: var(--keep); }

  #empty { text-align: center; color: var(--dim); padding: 80px 20px; font-size: 16px; }

  #box { position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 20; display: none;
         flex-direction: column; }
  #box.open { display: flex; }
  #boxbar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; }
  #boxinfo { flex: 1; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boxinfo b { color: var(--text); }
  #boxstate { font-weight: 700; border-radius: 4px; padding: 2px 9px; }
  #boxstage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 16px 16px; }
  #boxstage img, #boxstage video { max-width: 100%; max-height: 100%; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; display: none; z-index: 30; }
</style>
</head>
<body>
<header>
  <h1>photocull</h1>
  <div id="stats">Loading…</div>
  <div class="chips">
    <button data-filter="all" class="on">All</button>
    <button data-filter="exact">Identical</button>
    <button data-filter="similar">Similar</button>
    <button data-filter="video">Videos</button>
  </div>
  <button id="bestall" title="In every group shown, keep only the best shot">Keep best only (shown groups)</button>
  <button id="clear">Unmark all</button>
  <button id="trash" class="primary" disabled>Move to Trash</button>
</header>
<main>
  <p class="hint">Click a shot to mark it for the Trash or keep it. Extra identical copies start out marked.
    Keys: <kbd>J</kbd>/<kbd>K</kbd> next/previous group · <kbd>1</kbd>–<kbd>9</kbd> toggle a shot ·
    <kbd>B</kbd> keep best only · <kbd>A</kbd> keep all · <kbd>Space</kbd> compare full size
    (<kbd>←</kbd>/<kbd>→</kbd> flip, <kbd>X</kbd> toggle, <kbd>Esc</kbd> close).</p>
  <div id="list"></div>
  <div id="more"></div>
  <div id="empty" hidden></div>
</main>
<div id="box">
  <div id="boxbar">
    <div id="boxinfo"></div>
    <span id="boxstate"></span>
    <button id="boxreveal">Show in Finder</button>
    <button id="boxclose">Close</button>
  </div>
  <div id="boxstage"></div>
</div>
<div id="toast"></div>
<script>
const TOKEN = "__TOKEN__";
const PAGE = 40;
let groups = [], marks = new Map(), filter = "all", shown = [], rendered = 0, focus = 0;
let box = null; // {group, i}

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
                                 if (text != null) e.textContent = text; return e; };
const fmtSize = n => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB"
                                                             : Math.max(1, Math.round(n / 1e3)) + " KB";
const fmtTime = t => new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

async function post(url, body) {
  const r = await fetch(url, { method: "POST", body: JSON.stringify(body),
                               headers: { "Content-Type": "application/json", "X-Token": TOKEN } });
  if (!r.ok) throw new Error("Request failed (" + r.status + ")");
  return r.json();
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 5000);
}

async function load(keepMarks) {
  const data = await (await fetch("/api/groups")).json();
  groups = data.groups;
  const old = marks; marks = new Map();
  for (const g of groups) for (const s of g.shots)
    marks.set(s.id, keepMarks && old.has(s.id) ? old.get(s.id) : s.suggest);
  document.title = "photocull — " + data.root;
  applyFilter();
}

function applyFilter() {
  shown = groups.filter(g => filter === "all" || (filter === "video" ? g.shots.some(s => s.video) : g.kind === filter));
  $("list").textContent = ""; rendered = 0; focus = 0;
  const empty = $("empty");
  empty.hidden = shown.length > 0;
  empty.textContent = groups.length ? "No groups of this kind." : "No duplicates or similar shots found. Nothing to clean up.";
  renderMore(); updateStats();
}

function renderMore() {
  const end = Math.min(shown.length, rendered + PAGE);
  for (; rendered < end; rendered++) $("list").appendChild(renderGroup(shown[rendered], rendered));
  setFocus(focus, false);
}

function renderGroup(g, idx) {
  const card = el("div", "group"); card.dataset.gid = g.id;
  const head = el("div", "ghead");
  head.appendChild(el("span", "badge " + g.kind, g.kind === "exact" ? "Identical copies" : "Similar shots"));
  head.appendChild(el("span", "gmeta", g.shots.length + " shots · " + fmtTime(g.taken)));
  head.appendChild(el("span", "gwarn"));
  const best = el("button", null, "Keep best only"); best.onclick = () => keepBest(g);
  const all = el("button", null, "Keep all"); all.onclick = () => keepAll(g);
  head.append(best, all);
  card.appendChild(head);
  const tiles = el("div", "tiles");
  g.shots.forEach((s, i) => tiles.appendChild(renderTile(g, s, i)));
  card.appendChild(tiles);
  card.addEventListener("mouseenter", () => setFocus(idx, false));
  paintGroup(g, card);
  return card;
}

function renderTile(g, s, i) {
  const t = el("div", "tile"); t.dataset.sid = s.id;
  const pic = el("div", "pic");
  if (s.thumb) { const img = el("img"); img.loading = "lazy"; img.src = "/thumb/" + s.id; img.alt = s.name; pic.appendChild(img); }
  else pic.appendChild(el("span", "nothumb", "No preview"));
  t.appendChild(pic);
  t.appendChild(el("span", "state"));
  t.appendChild(el("span", "num", String(i + 1)));
  const zoom = el("button", "zoom", s.video ? "Play" : "View");
  zoom.onclick = e => { e.stopPropagation(); openBox(g, i); };
  t.appendChild(zoom);
  const cap = el("div", "cap");
  const name = el("div", "name", s.name); name.title = s.folder + "/" + s.name;
  cap.appendChild(name);
  cap.appendChild(el("div", "sub", (s.w ? s.w + "×" + s.h + " · " : "") + fmtSize(s.size)));
  const folder = el("div", "sub", s.folder === "." ? "(top folder)" : s.folder); folder.title = s.folder;
  cap.appendChild(folder);
  const tags = el("div", "tags");
  if (i === 0) tags.appendChild(el("span", "tag best", "Best"));
  if (s.raw) tags.appendChild(el("span", "tag", s.files > 1 ? "RAW+JPG" : "RAW"));
  if (s.video) tags.appendChild(el("span", "tag", "Video"));
  if (s.identical) tags.appendChild(el("span", "tag", "Identical copy"));
  cap.appendChild(tags);
  t.appendChild(cap);
  t.onclick = () => toggle(g, s.id);
  return t;
}

function cardOf(g) { return document.querySelector('.group[data-gid="' + g.id + '"]'); }

function paintGroup(g, card) {
  card = card || cardOf(g); if (!card) return;
  let gone = 0;
  for (const s of g.shots) {
    const t = card.querySelector('.tile[data-sid="' + s.id + '"]'), m = marks.get(s.id);
    t.classList.toggle("marked", m); t.querySelector(".state").textContent = m ? "TRASH" : "KEEP";
    if (m) gone++;
  }
  const allGone = gone === g.shots.length;
  card.classList.toggle("allgone", allGone);
  card.querySelector(".gwarn").textContent = allGone ? "Every shot in this group is marked" : "";
}

function toggle(g, id) { marks.set(id, !marks.get(id)); paintGroup(g); updateStats(); paintBox(); }
function keepBest(g) { g.shots.forEach((s, i) => marks.set(s.id, i > 0)); paintGroup(g); updateStats(); }
function keepAll(g) { g.shots.forEach(s => marks.set(s.id, false)); paintGroup(g); updateStats(); }

function marked() { const out = []; for (const g of groups) for (const s of g.shots) if (marks.get(s.id)) out.push(s); return out; }

function updateStats() {
  const m = marked(), bytes = m.reduce((a, s) => a + s.size, 0);
  const shots = groups.reduce((a, g) => a + g.shots.length, 0);
  const st = $("stats"); st.textContent = "";
  st.append(el("b", null, String(groups.length)), " groups · ", el("b", null, String(shots)), " shots · ",
            el("b", null, String(m.length)), " marked" + (m.length ? " (frees " + fmtSize(bytes) + ")" : ""));
  const btn = $("trash"); btn.disabled = !m.length;
  btn.textContent = m.length ? "Move " + m.length + " to Trash" : "Move to Trash";
}

function setFocus(i, scroll) {
  if (!shown.length) return;
  focus = Math.max(0, Math.min(shown.length - 1, i));
  while (focus >= rendered && rendered < shown.length) renderMore();
  document.querySelectorAll(".group.focus").forEach(c => c.classList.remove("focus"));
  const card = cardOf(shown[focus]);
  if (card) { card.classList.add("focus"); if (scroll) card.scrollIntoView({ block: "center", behavior: "smooth" }); }
}

/* ---------- full-size compare ---------- */
function openBox(g, i) { box = { group: g, i: i }; $("box").classList.add("open"); showBox(); }
function closeBox() { box = null; $("box").classList.remove("open"); $("boxstage").textContent = ""; }
function showBox() {
  const s = box.group.shots[box.i], stage = $("boxstage"); stage.textContent = "";
  if (s.video) { const v = el("video"); v.controls = true; v.autoplay = true; v.src = "/media/" + s.id; stage.appendChild(v); }
  else { const img = el("img"); img.src = "/preview/" + s.id; img.alt = s.name; stage.appendChild(img); }
  paintBox();
}
function paintBox() {
  if (!box) return;
  const s = box.group.shots[box.i], m = marks.get(s.id), info = $("boxinfo");
  info.textContent = "";
  info.append(el("b", null, (box.i + 1) + " / " + box.group.shots.length + "  " + s.name),
              "  ·  " + (s.w ? s.w + "×" + s.h + " · " : "") + fmtSize(s.size) + " · " + fmtTime(s.taken) + " · " + s.folder);
  const st = $("boxstate"); st.textContent = m ? "TRASH" : "KEEP";
  st.style.background = m ? "var(--trash)" : "var(--keep)"; st.style.color = m ? "#fff" : "#06281a";
}
function stepBox(d) { const n = box.group.shots.length; box.i = (box.i + d + n) % n; showBox(); }
$("boxclose").onclick = closeBox;
$("boxreveal").onclick = () => post("/api/reveal", { id: box.group.shots[box.i].id });
$("boxstate").onclick = () => toggle(box.group, box.group.shots[box.i].id);

/* ---------- actions ---------- */
document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("on", x === b));
  applyFilter();
});
$("bestall").onclick = () => {
  if (!shown.length) return;
  if (!confirm("Mark everything except the best shot in all " + shown.length + " groups shown?\n\nNothing is deleted until you press Move to Trash.")) return;
  shown.forEach(g => { g.shots.forEach((s, i) => marks.set(s.id, i > 0)); paintGroup(g); });
  updateStats();
};
$("clear").onclick = () => { groups.forEach(g => { g.shots.forEach(s => marks.set(s.id, false)); paintGroup(g); }); updateStats(); };
$("trash").onclick = async () => {
  const m = marked(); if (!m.length) return;
  const files = m.reduce((a, s) => a + s.files, 0), bytes = m.reduce((a, s) => a + s.size, 0);
  const wiped = groups.filter(g => g.shots.every(s => marks.get(s.id))).length;
  let msg = "Move " + m.length + " shots (" + files + " files, " + fmtSize(bytes) + ") to the Trash?";
  if (wiped) msg += "\n\nWarning: in " + wiped + " group(s) every shot is marked, so no copy will be kept.";
  msg += "\n\nYou can restore them from the Trash until you empty it.";
  if (!confirm(msg)) return;
  const btn = $("trash"); btn.disabled = true; btn.textContent = "Moving…";
  try {
    const r = await post("/api/trash", { ids: m.map(s => s.id) });
    toast("Moved " + r.trashed + " shots (" + r.files + " files) to the Trash." +
          (r.failed.length ? " " + r.failed.length + " files could not be moved." : ""));
    await load(true);
  } catch (e) { toast(e.message); updateStats(); }
};

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (box) {
    if (k === "escape") closeBox();
    else if (k === "arrowright") stepBox(1);
    else if (k === "arrowleft") stepBox(-1);
    else if (k === "x" || k === "d") toggle(box.group, box.group.shots[box.i].id);
    else return;
    return e.preventDefault();
  }
  const g = shown[focus]; if (!g) return;
  if (k === "j") setFocus(focus + 1, true);
  else if (k === "k") setFocus(focus - 1, true);
  else if (k === "b") keepBest(g);
  else if (k === "a") keepAll(g);
  else if (k === " ") openBox(g, 0);
  else if (k >= "1" && k <= "9" && g.shots[+k - 1]) toggle(g, g.shots[+k - 1].id);
  else return;
  e.preventDefault();
});

new IntersectionObserver(es => { if (es[0].isIntersecting && rendered < shown.length) renderMore(); },
                         { rootMargin: "800px" }).observe($("more"));
load(false);
</script>
</body>
</html>
